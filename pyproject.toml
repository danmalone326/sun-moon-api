[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sun-moon-api"
version = "0.1.0"
requires-python = ">=3.7"
dependencies = ["numpy>=1.26,<3; python_version >= '3.10'", "numpy==1.21.6; python_version < '3.10'", "skyfield>=1.53,<2; python_version >= '3.10'", "skyfield==1.49; python_version < '3.10'", "timezonefinder>=6.5,<7; python_version >= '3.10'", "timezonefinder==5.2.0; python_version < '3.10'", "backports.zoneinfo==0.2.1; python_version < '3.9'"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

