[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sun-moon-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "skyfield>=1.53,<2", "timezonefinder>=6.5,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

